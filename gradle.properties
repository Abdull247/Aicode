# Baseline environment: GitHub Actions public repo runner (4 vCPU / 16 GB RAM / 14 GB SSD).
# With 16 GB, give the daemon a 6144m heap: in-process Kotlin compilation of the three release flavors shares this
# one heap, and 4096m intermittently OOMs ("Not enough memory to run compilation") when the flavors build together.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC

# Compile Kotlin in-process: runs inside the Gradle daemon, saving a separate Kotlin daemon JVM (and its memory).
# One of the officially recommended strategies; see kotlin.compiler.execution.strategy.
kotlin.compiler.execution.strategy=in-process

# Keep peak memory below the 16 GB limit: the release build compiles/R8s all three flavors at once, so cap concurrent
# heavy workers at 2 (independent of the 4 vCPUs) to avoid the OOM seen with 4.
org.gradle.workers.max=2

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
# Configuration cache: on a hit, skip the whole configuration phase (script compilation + plugin init + task graph).
# problems=warn keeps incompatible features as warnings instead of failing the build.
# Note the property name: it is configuration-cache (not configure-cache); a typo fails silently rather than erroring.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.enableJetifier=true
# Jetifier skips byte-buddy (a mockk transitive dependency): its 1.18.x is a multi-release jar
# whose META-INF/versions/24/ classes are compiled for Java 24 (class file 68), which Jetifier's bundled ASM cannot read.
# It is a pure-JVM test library that never touches support classes, so no conversion is needed.
android.jetifier.ignorelist=byte-buddy,byte-buddy-agent

android.suppressUnsupportedCompileSdk=37

# Force JAR (v1) signing in addition to v2/v3. AGP 8 Signflinger otherwise
# emits a stub MANIFEST.MF that MT Manager / some OEM installers reject
# ("Signature: Verified failed" / "package appears to be invalid").
android.injected.signing.enableV1Signing=true
