name: Sync Code & Releases to GitCode

# Periodically mirror the main GitHub repo to GitCode (for users who cannot reach GitHub):
#   - Code: all branches and tags (push --prune keeps GitCode refs identical to GitHub; never edit code directly on GitCode)
#   - Release assets: sync Release APKs from GitHub to GitCode Releases (idempotent; keeps the latest 3 stable releases by default, RCs excluded)
# Runs once a day (schedule, UTC 03:17); can also be triggered manually from the Actions page (workflow_dispatch).
# Prerequisite: GitHub secret GITCODE_TOKEN = a GitCode personal access token (needs repo read/write + API access)
#           the username is fixed as oauth2 and the token is the password (verified that GitCode supports this auth).

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needs all branches and tags; a shallow clone (default depth=1) cannot cover them
          fetch-depth: 0

      - name: Push branches & tags to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
        run: |
          set -euo pipefail
          if [[ -z "$GITCODE_TOKEN" ]]; then
            echo "::warning::GITCODE_TOKEN is not set; skipping GitCode code sync. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          owner="${GITCODE_OWNER:-${GITHUB_REPOSITORY%/*}}"
          repo="${GITCODE_REPO:-${GITHUB_REPOSITORY#*/}}"
          echo "Target GitCode repository: ${owner}/${repo}"
          git remote add gitcode "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${owner}/${repo}.git"
          git push --prune gitcode \
            "+refs/heads/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
          echo "✓ Code and tags synced to https://gitcode.com/${owner}/${repo}"

      # Release APK sync: download assets from GitHub Releases and fill in GitCode Releases (idempotent;
      # already-synced ones are skipped and failures can be retried). GitCode has no public attachment quota, and deleting a Release
      # only works by deleting the tag (destructive side effects), so no auto-cleanup — just incrementally fill in missing assets.
      - name: Sync Release assets to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO }}
        run: |
          set -euo pipefail
          if [[ -z "$GITCODE_TOKEN" ]]; then
            echo "::warning::GITCODE_TOKEN is not set; skipping GitCode Release sync. Add it under Settings > Secrets and variables > Actions."
            exit 0
          fi
          python3 scripts/sync-gitcode-releases.py
          echo "✓ Release assets synced to https://gitcode.com/${GITCODE_OWNER:-${GITHUB_REPOSITORY%/*}}/${GITCODE_REPO:-${GITHUB_REPOSITORY#*/}}/releases"
