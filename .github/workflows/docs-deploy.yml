name: Deploy Docs

# Deploy the docs site only on tag pushes so docs not yet shipped with a release never go public from main.
# Vercel's Git auto-deploy is disabled in docs-site/vercel.json via git.deploymentEnabled=false;
# production deployments go through this workflow using the Vercel CLI.
# Prerequisites (GitHub repo secrets): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# The Vercel project must set Root Directory = docs-site. The CLI must run from the repo root (per the official monorepo guide):
# running vercel inside a subdirectory misses docs-site/vercel.json and falls back to the VitePress preset default command, failing with "vitepress not found".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docs to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}