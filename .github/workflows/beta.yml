name: Beta Build

# On push to main, build a test package automatically: universal flavor, real signing, same config as release (R8/resource shrinking),
# only with the .beta applicationId suffix (com.aicode.beta; can coexist with the release build on one device).
# Artifacts upload to Actions Artifacts (retained 90 days by default); they never land in GitHub Releases.
# Official releases for v* tags run in android-release.yml; the pre-merge gate is ci.yml.
on:
  push:
    branches: [ main ]
    # Docs-only/asset changes do not affect the APK; skip them to save time (consistent with ci.yml).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - 'LICENSE'
      - '.gitignore'
  # Can be triggered manually from the Actions page to verify the pipeline.
  workflow_dispatch:

# Cancel older beta builds on the same branch when new commits arrive, to save CI minutes.
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Beta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # versionCode comes from gitCommitCount() in build.gradle.kts, which reads `git rev-list --count HEAD`;
          # a shallow clone (default depth=1) returns 1, so full history is required or version numbering breaks.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The preinstalled SDK only goes up to android-36, but compileSdk is 37 (required by PrismalAGSL), so the platform must be installed.
      # Avoid android-actions/setup-android: it runs the deprecated `sdkmanager tools` and always fails.
      - name: Install Android platform 37 & build-tools 36
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          if [ -z "$SM" ]; then SM="$(command -v sdkmanager 2>/dev/null || true)"; fi
          echo "sdkmanager=$SM"
          if [ -z "$SM" ]; then echo "::error::sdkmanager not found"; exit 1; fi
          yes 2>/dev/null | "$SM" --sdk_root="$SDK" --install "build-tools;36.0.0"
          # Google's remote no longer hosts platforms;android-37 (the Android 17 platform was renamed to android-37.0/37.1/37.2),
          # while the local dev machine still has the original Platform 37 package (api-level=37 rev=2).
          # Any knock-off "patched 37.0 metadata" package fails AGP's validation:
          #   package.xml path=37.0 -> inconsistent location; the whole directory gets ignored;
          #   source.properties ApiLevel=37.0 -> the platform resolves to API 0;
          #   removing both -> AGP has no registry to consult and reports Failed to find Platform SDK.
          # The genuine package is attached as an asset to the v1.0.1 Release (android-platform-37.zip);
          # download and extract it directly; it is byte-identical to the locally compilable form.
          rm -rf "$SDK/platforms/android-37"
          curl -sSL --retry 3 -o /tmp/android-37.zip             "https://github.com/hwsyyds666/AiCode/releases/download/v1.0.1/android-platform-37.zip"
          unzip -q -o /tmp/android-37.zip -d "$SDK/platforms/"
          rm -f /tmp/android-37.zip
          echo "--- platforms ---"
          ls -1 "$SDK/platforms" | grep -E "android-3[5-9]" || true
          grep -E "^ro.build.version.sdk=" "$SDK/platforms/android-37/build.prop"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # beta uses the real signing setup: restore the keystore from secrets to app/aicode.jks and generate keystore.properties,
      # exactly matching android-release.yml; missing either step leaves the beta APK unsigned.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/aicode.jks
          echo "keystore restored ($(stat -c%s app/aicode.jks) bytes)"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          cat > app/keystore.properties <<EOF
          storeFile=aicode.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "app/keystore.properties generated"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Build the universal beta (arm64-v8a + x86_64, the universal package with both container images).
      # --stacktrace: print the full stack on failure to help pinpoint OOM/memory-related root causes.
      - name: Build universal beta APK
        run: ./gradlew :app:assembleUniversalBeta --stacktrace

      # Rename the output to aicode-universal-beta-<sha7>.apk; the short sha distinguishes builds.
      # Also attach the R8 mapping (mapping.txt) so beta crash reports can be de-obfuscated.
      - name: Rename APK & collect mapping
        run: |
          set -e
          mkdir -p dist
          sha7="${GITHUB_SHA::7}"
          cp "app/build/outputs/apk/universal/beta/app-universal-beta.apk" \
             "dist/aicode-universal-beta-${sha7}.apk"
          # On AGP 8.x the mapping output directory uses the variant's camelCase name (flavor + BuildType),
          # i.e. outputs/mapping/universalBeta/, not outputs/mapping/universal/beta/.
          if [[ -f "app/build/outputs/mapping/universalBeta/mapping.txt" ]]; then
            cp "app/build/outputs/mapping/universalBeta/mapping.txt" \
               "dist/aicode-universal-beta-${sha7}-mapping.txt"
          fi
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicode-beta-${{ github.sha }}
          # Artifacts are retained for 90 days by default; no explicit setting needed.
          path: |
            dist/aicode-universal-beta-*.apk
            dist/aicode-universal-beta-*-mapping.txt
          if-no-files-found: error